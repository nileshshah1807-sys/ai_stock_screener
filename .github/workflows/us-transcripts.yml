name: US call transcripts
run-name: US call transcripts (${{ github.event_name }})

# S&P 500 earnings calls, a few a day (workers/us_transcripts.py): each call is
# found by its results 8-K in EDGAR and fetched from Alpha Vantage, newest first,
# at most 24 requests a run -- the free key allows 25 a day and the earnings
# calendar (financial-statements.yml, before 09:00 UTC) takes one. Leftover budget
# fills in earlier quarters, so there is no bulk backfill. Then, as for NSE: the
# outlook of each new call (the US screener blends it with tone; tone itself is
# scored by transcript-sentiment.yml, whose queue covers both markets) and the
# US Concalls feed. Nothing here fails the job on a source's refusal.
#
# 13:30 UTC: a call held the evening before (US time) has had most of a day to
# reach Alpha Vantage, and the US screener (from 21:37 UTC) reads it the same day.

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and print, store nothing (spends Alpha Vantage requests all the same)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # One run at a time: two would spend the day's allowance twice.
  group: us-transcripts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARKET: US
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OBJECT_STORE_BACKEND: ${{ secrets.R2_BUCKET && 'r2' || '' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # The CI lock: none of these steps imports torch.
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt

      - name: Fetch call transcripts
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python -m workers.us_transcripts ${DRY_RUN}

      # The US prompt is NSE's with the country and currency changed
      # (sentiment.outlook.system_prompt). A call still pending here is scored
      # on tone alone; a missing key or a spent cap degrades, never blocks.
      - name: Extract call outlooks
        if: ${{ !inputs.dry_run }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::OPENROUTER_API_KEY secret is not set; outlook extraction skipped"
            exit 0
          fi
          python -m tools.extract_transcript_outlook --market US --max-cost 0.50

      - name: Publish the US concall feed
        if: ${{ !inputs.dry_run }}
        run: python -m workers.concall_feed --market US
