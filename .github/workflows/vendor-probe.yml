name: Vendor transcript probe
# Temporary: one run on this branch to see whether a hosted runner can list
# the vendor and read a transcript. Deleted before the branch is merged.
on:
  push:
    branches: [feat/vendor-transcript-fallback]
    paths: [.github/workflows/vendor-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-speech.txt
      - env:
          VENDOR: https://alphastreet.com/india
        run: |
          python - <<'PY'
          import os, time
          from transcripts.vendor_transcripts import fetch_transcript, list_transcripts

          started = time.time()
          listing = list_transcripts(os.environ["VENDOR"])
          print(f"::notice title=Listing::{len(listing)} transcripts in {time.time() - started:.0f}s")
          for entry in listing[:3]:
              text = fetch_transcript(os.environ["VENDOR"], entry) or ""
              level = "notice" if len(text) > 3000 else "error"
              print(f"::{level} title=Transcript {entry['id']}::{len(text)} characters")
          PY
