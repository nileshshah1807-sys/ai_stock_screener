name: Earnings transcript sentiment
run-name: Earnings transcript sentiment (${{ github.event_name }})

on:
  schedule:
    - cron: "30 4,11,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual debugging must not replace a delayed scheduled run in GitHub's
  # single-pending concurrency slot.
  group: transcript-sentiment-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Idempotent upserts make this a rolling backfill, not duplicate storage.
      TRANSCRIPT_LOOKBACK_DAYS: "120"
      TRANSCRIPT_OCR_ENABLED: "true"
      TRANSCRIPT_MAX_PAGES: "120"
      TRANSCRIPT_MIN_TEXT_CHARACTERS: "1000"
      TRANSCRIPT_MAX_DOCUMENTS_PER_RUN: "60"
      TRANSCRIPT_MAX_ANALYSES_PER_RUN: "60"
      TRANSCRIPT_ENABLE_FINBERT: "true"
      TRANSCRIPT_REQUIRE_FINBERT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install OCR runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-finbert-v1

      - name: Run regression tests
        env:
          TRANSCRIPT_ENABLE_FINBERT: "false"
        run: python -m unittest discover -s tests

      - name: Collect and analyze transcripts
        run: python -m workers.transcript_worker
