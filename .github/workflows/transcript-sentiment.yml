name: Earnings transcript sentiment

on:
  schedule:
    - cron: "30 4,11,15 * * *"
  workflow_dispatch:
    inputs:
      debug_response_content:
        description: "Log bounded OpenRouter response content for this manual run"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: transcript-sentiment
  cancel-in-progress: false

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: nvidia/nemotron-3-ultra-550b-a55b:free
      OPENROUTER_MAX_RETRIES: "2"
      OPENROUTER_TIMEOUT_SECONDS: "90"
      OPENROUTER_MAX_OUTPUT_TOKENS: "600"
      OPENROUTER_DEBUG_RESPONSE_CONTENT: ${{ github.event.inputs.debug_response_content || 'false' }}
      OPENROUTER_DEBUG_MAX_CONTENT_CHARS: "2000"
      TRANSCRIPT_LOOKBACK_DAYS: "7"
      TRANSCRIPT_OCR_ENABLED: "true"
      TRANSCRIPT_MAX_PAGES: "120"
      TRANSCRIPT_MIN_TEXT_CHARACTERS: "1000"
      TRANSCRIPT_ANALYSIS_LIMIT: "25"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install OCR runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Collect and analyze transcripts
        run: python -m workers.transcript_worker