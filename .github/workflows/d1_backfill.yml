name: D1 backfill
run-name: D1 backfill

# Copies the data tables from Supabase into the three D1 databases, one day's
# write budget at a time, resuming where the last run stopped (progress is a row
# in cupel-core, so a fresh runner picks it up). See tools/d1_tables.py and
# docs/d1_migration_plan.md.
#
# Dispatch-only: meant to be called by a cron-job.org job once a day just after
# 00:00 UTC, when D1's 100,000 rows written a day (per account) resets; until a
# human creates that job it is run by hand. Do not add a `schedule:`, it
# would double every run. A run that reaches the budget stops loudly in its log
# and summary but stays green; one with nothing left says so and stays green.

on:
  workflow_dispatch:
    inputs:
      tables:
        description: Tables to copy, in order ("all" = the plan's order)
        required: false
        default: all
        type: string
      rows_per_day:
        description: Rows written today by this job at most (blank = the D1_BACKFILL_ROWS_PER_DAY variable, else 75000)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Two runs would share one day's budget and one progress row.
  group: d1-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      D1_ACCOUNT_ID: ${{ vars.D1_ACCOUNT_ID }}
      D1_CORE_ID: ${{ vars.D1_CORE_ID }}
      D1_EVIDENCE_ID: ${{ vars.D1_EVIDENCE_ID }}
      D1_HISTORY_ID: ${{ vars.D1_HISTORY_ID }}
      TRANSCRIPT_ENABLE_FINBERT: "false"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt

      - name: Run regression tests
        run: python -m unittest tests.test_d1_tables tests.test_d1_backend tests.test_d1_snapshot_layout

      - name: Create missing tables
        env:
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
        run: python -m tools.d1_tables apply

      - name: Copy within the day's budget
        env:
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TABLES: ${{ inputs.tables || 'all' }}
          ROWS: ${{ inputs.rows_per_day || vars.D1_BACKFILL_ROWS_PER_DAY || '75000' }}
        run: |
          set +e
          python -m tools.d1_tables backfill ${TABLES} --state d1 --max-rows-written "${ROWS}" 2>&1 | tee backfill.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## D1 backfill"
            if [ "$status" = 2 ]; then echo "**Stopped at the day's budget (${ROWS} rows); the next run resumes.**"; fi
            echo '```'
            grep -E "rows read|: pass |rows written today|backfill complete|Stopped at" backfill.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = 2 ]; then echo "::warning::Stopped at the day's D1 write budget (${ROWS}); resumes next run"; exit 0; fi
          exit "$status"

      - name: Copied and remaining per table
        if: always()
        env:
          D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          {
            echo "## Copied / remaining"
            echo '```'
            python -m tools.d1_tables verify
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
