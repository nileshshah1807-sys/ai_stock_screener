name: Earnings call recordings
run-name: Earnings call recordings (${{ github.event_name }})

# Reads a call the day it is held. A company files its transcript days later,
# but a "link of recording" notice the same evening; this transcribes that
# recording with an open-source speech model on the runners' own CPUs and
# stores the text as the call's transcript, so the tone score, the outlook and
# the daily screener pick it up. The transcript worker replaces it with the
# filed transcript when that arrives.
#
# Three jobs because an hour of audio takes twenty minutes on one runner and
# five on four (measured 12 Oct 2026): `plan` cuts each recording at pauses,
# `piece` transcribes one piece per runner, `assemble` joins and scores them.
on:
  schedule:
    # Every half hour from 11:37 to 00:07 IST, when recordings are filed, and
    # once in the morning for anything filed overnight. Off the hour, where
    # GitHub's scheduler is least delayed.
    - cron: "7,37 6-18 * * *"
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Days of recording notices to read
        default: "3"
      max_calls:
        description: Calls to transcribe in this run
        default: "5"

permissions:
  contents: read

concurrency:
  # One run at a time: a second would plan the calls the first is transcribing.
  group: call-recordings
  cancel-in-progress: false

env:
  MARKET: NSE

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      calls: ${{ steps.plan.outputs.calls }}
      vendor_transcripts: ${{ steps.plan.outputs.vendor_transcripts }}
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CALL_RECORDING_LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
      # Four pieces a call against twenty concurrent jobs.
      CALL_RECORDING_MAX_CALLS_PER_RUN: ${{ inputs.max_calls || '5' }}
      # An investor page that reads as holding no recording is opened in the
      # runner's own Chrome, headless, to see the audio file it asks for:
      # some pages build their player with a script and some refuse anything
      # but a browser. Nothing is played; the file is then downloaded as any
      # other. Remove this line to switch it off.
      CALL_RECORDING_BROWSER: "true"
      # CALL_TRANSCRIPT_VENDOR_URL is deliberately not set. The vendor whose
      # transcripts transcripts/vendor_transcripts.py could read was asked
      # and refused: its text needs a licensing agreement. Do not set it to a
      # site without that site's written permission.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-speech.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt -r requirements-speech.txt

      - name: Find new recordings and cut them
        id: plan
        run: python -m workers.call_recordings plan --out call-recordings

      # The recordings travel to the piece jobs as an artifact so that each
      # company's site is asked for its file once, not once per piece. They
      # are public filings; the artifact expires after a day.
      # Uploaded for a vendor's transcript too: the assemble job reads the
      # plan to know there is something to score.
      - name: Hand the recordings to the piece jobs
        if: steps.plan.outputs.calls != '0' || steps.plan.outputs.vendor_transcripts != '0'
        uses: actions/upload-artifact@v6
        with:
          name: call-recordings-plan
          path: call-recordings
          retention-days: 1
          if-no-files-found: error

  piece:
    needs: plan
    if: needs.plan.outputs.calls != '0'
    name: "${{ matrix.symbol }} ${{ matrix.part }}/${{ matrix.parts }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One piece failing must not cancel another company's call.
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-speech.txt

      # No secrets and nothing but the speech packages: this job only turns
      # audio into text. ffmpeg comes from a Python package -- installing it
      # with apt hung one runner in the benchmark for an hour.
      - name: Install dependencies
        run: python -m pip install -r requirements-speech.txt

      - uses: actions/download-artifact@v7
        with:
          name: call-recordings-plan
          path: call-recordings

      # A fifteen-minute piece takes about five. One in sixteen hung in the
      # benchmark, so each attempt is bounded and tried twice.
      - name: Transcribe the piece
        env:
          PIECE_KEY: ${{ matrix.key }}
          PIECE_PART: ${{ matrix.part }}
        run: |
          for attempt in 1 2; do
            if timeout 15m python -m workers.call_recordings piece \
              --plan call-recordings/plan.json \
              --key "$PIECE_KEY" \
              --part "$PIECE_PART" \
              --out pieces; then
              exit 0
            fi
            echo "::warning::piece attempt $attempt failed or timed out"
          done
          exit 1

      - uses: actions/upload-artifact@v6
        with:
          name: call-piece-${{ matrix.key }}-${{ matrix.part }}
          path: pieces
          retention-days: 1
          if-no-files-found: error

  assemble:
    needs: [plan, piece]
    # Whatever the pieces did: a call with a piece missing is recorded as
    # failed and tried again, and the complete ones are stored.
    # It also runs when the plan stored a vendor's transcript and cut nothing:
    # that call is as unscored as one from a recording.
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.calls != '0' || needs.plan.outputs.vendor_transcripts != '0')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # The tone analysis below must be the transcript-sentiment workflow's
      # own, setting for setting: a transcript is "scored" for a model name,
      # so another name here would score every stored call again.
      TRANSCRIPT_MAX_ANALYSES_PER_RUN: "300"
      TRANSCRIPT_ANALYSIS_BATCH_SIZE: "10"
      TRANSCRIPT_FINBERT_BATCH_SIZE: "1"
      TRANSCRIPT_FINBERT_MAX_SENTENCES_PER_CHUNK: "8"
      TRANSCRIPT_FINBERT_INFERENCE_WINDOW: "256"
      TRANSCRIPT_ENABLE_FINBERT: "true"
      TRANSCRIPT_REQUIRE_FINBERT: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # No pip cache, for the transcript-sentiment workflow's reason: the
          # production lock's torch wheels make a ~3 GB cache entry.

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # Read, never written: the transcript-sentiment workflow owns this entry.
      - name: Restore Hugging Face models
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-finbert-v1

      - uses: actions/download-artifact@v7
        with:
          name: call-recordings-plan
          path: call-recordings

      - uses: actions/download-artifact@v7
        if: needs.plan.outputs.calls != '0'
        with:
          pattern: call-piece-*
          path: pieces
          merge-multiple: true

      - name: Store the calls and score their tone
        run: python -m workers.call_recordings assemble --plan call-recordings/plan.json --pieces pieces

      # The outlook of each new call, as in the transcript-sentiment workflow.
      # A call still pending here is scored on tone alone until its next run.
      - name: Extract call outlooks
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::OPENROUTER_API_KEY secret is not set; outlook extraction skipped"
            exit 0
          fi
          python -m tools.extract_transcript_outlook --latest-only --max-cost 0.25

      - name: Publish the concall feed
        run: python -m workers.concall_feed

      # The bell in the dashboard's header. The Financial statements workflow
      # records events three times a day; run here as well, a call stored
      # above is announced now and not at that workflow's next slot. It is
      # idempotent, so the two never announce one call twice.
      - name: Record events for notifications
        if: ${{ !cancelled() }}
        run: python -m workers.market_events --market "${MARKET}"
