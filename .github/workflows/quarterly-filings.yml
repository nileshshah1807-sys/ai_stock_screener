name: Quarterly filings
run-name: Quarterly filings (${{ github.event_name }})

# Stores every quarterly results filing NSE publishes, parsed once, in the
# quarterly_filings table (workers/quarterly_filings.py). The only job that
# reads the exchange's filing index and its documents; everything else reads
# the table:
#
#   * the stock page's quarterly results -- the worker redraws them for each
#     company it stored a filing for, so a result filed this evening is on
#     the page this evening;
#   * the screener's latest-quarter growth (daily-stock-screener.yml), which
#     fetches nothing from the exchange itself;
#   * the notification bell, recorded by the step after it, so the bell never
#     announces a result the page cannot show.
#
# It also stores the stock page's Shareholding tab: each quarter's
# shareholding pattern and the day's bulk and block deals
# (workers/shareholding.py, storage/shareholding_schema.sql). Filed through
# the same weeks as results and cheap when nothing is new, so it rides along
# rather than needing a schedule of its own.
#
# Dispatch only: cron-job.org calls GitHub's workflow-dispatch API every 15
# minutes, and once a day with full=true. GitHub's own schedule was not used
# because it delays and drops runs under load, which for a job whose point is
# "on the page the evening it is filed" is the failure that matters. Each
# call is one run; the concurrency group below keeps them from overlapping.
#
# A run with nothing new reads one page of the index and fetches no
# document, well under a minute. Companies file from mid-morning to midnight
# India time, most of them in the evening.
#
# The daily full=true run reads the whole index the exchange serves, which
# picks up any filing every short run missed. The first run against an empty
# table is a full sweep by itself: about 23,000 documents, some 12 minutes
# (measured October 2026). Should a sweep outrun its budget it stops cleanly
# and the next run carries on, newest filings first.
#
# NSE only: the US has no exchange filing index (its statements come from
# SEC EDGAR via the Financial statements workflow).

on:
  workflow_dispatch:
    inputs:
      full:
        description: Read the whole index rather than the last few days
        required: false
        default: false
        type: boolean
      dry_run:
        description: Fetch and parse without writing to Supabase
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # One run at a time: two would fetch the same new filings. A run that is
  # still working when the next slot fires is left to finish.
  group: quarterly-filings
  cancel-in-progress: false

jobs:
  store:
    name: NSE
    runs-on: ubuntu-latest
    # Step budgets 22 + 12 + 6 minutes, plus setup and the events step.
    timeout-minutes: 50
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MARKET: NSE

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # The CI lock: no torch/transformers, which this worker never imports.
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt

      - name: Store new filings
        env:
          FILING_ATTEMPTS_PATH: ${{ runner.temp }}/filing-attempts.json
          FULL: ${{ inputs.full && '--full' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        # The budget leaves room for setup and the final writes inside the
        # job timeout; whatever is left is fetched by the next run.
        run: |
          python -m workers.quarterly_filings \
            --market NSE \
            --time-budget-minutes 22 \
            ${FULL} \
            ${DRY_RUN}

      # Which filings were not stored and why (fetch refused, format not read),
      # for whoever audits a missing result: gh run download <id> -n filing-attempts.
      - name: Keep the filings not stored
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: filing-attempts
          path: ${{ runner.temp }}/filing-attempts.json
          retention-days: 14
          if-no-files-found: ignore

      # Shareholding patterns and bulk/block deals for the stock page. Runs
      # even if the results step failed; the two share nothing. The first
      # full sweep is some 30,000 patterns; the budget stops it cleanly and
      # the next daily full run carries on.
      - name: Store shareholding patterns and deals
        if: ${{ !cancelled() }}
        env:
          FULL: ${{ inputs.full && '--full' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          python -m workers.shareholding \
            --market NSE \
            --time-budget-minutes 12 \
            ${FULL} \
            ${DRY_RUN}

      # Results and shareholding of companies listed on BSE alone, through the
      # two steps above's own code (workers/bse_filings.py). Stores nothing
      # until workers/bse_source.py is written.
      - name: Store BSE-only filings
        if: ${{ !cancelled() }}
        env:
          FULL: ${{ inputs.full && '--full' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          python -m workers.bse_filings \
            --time-budget-minutes 6 \
            ${FULL} \
            ${DRY_RUN}

      # Results filed and transcripts stored (workers/market_events.py). Runs
      # even if the step above failed: transcripts do not depend on it, and a
      # result is announced only once its filing is stored.
      - name: Record events for notifications
        if: ${{ !cancelled() }}
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python -m workers.market_events --market NSE ${DRY_RUN}
