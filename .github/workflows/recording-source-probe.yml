name: Recording source probe
# Temporary: one run on this branch to see whether a hosted runner can list a
# channel and fetch a video's audio. Deleted before the branch is merged.
on:
  push:
    branches: [feat/recording-fallbacks]
    paths: [.github/workflows/recording-source-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-speech.txt
      - name: List the channel and fetch three calls
        env:
          CHANNEL: https://www.youtube.com/@ConCall.Inc5
        run: |
          python - <<'PY'
          import os, tempfile, time
          from pathlib import Path

          import yt_dlp

          from transcripts.recording_sources import _TITLE, list_channel

          videos = [v for v in list_channel(os.environ["CHANNEL"], 40) if _TITLE.match(str(v.get("title") or ""))]
          url = f"https://www.youtube.com/watch?v={videos[0]['id']}"
          folder = Path(tempfile.mkdtemp())

          class Log:
              def __init__(self): self.lines = []
              def debug(self, message): pass
              def warning(self, message): self.lines.append("W " + message)
              def error(self, message): self.lines.append("E " + message)

          def attempt(label, **extra):
              log = Log()
              options = {"quiet": True, "noprogress": True, "noplaylist": True, "logger": log,
                         "outtmpl": str(folder / f"{label}.%(ext)s"), "js_runtimes": {"deno": {}, "node": {}}, **extra}
              started = time.time()
              try:
                  with yt_dlp.YoutubeDL(options) as downloader:
                      downloader.extract_info(url, download=True)
                  files = sorted(f"{p.suffix} {p.stat().st_size / 1e6:.1f} MB" for p in folder.glob(f"{label}.*"))
                  print(f"::notice title={label}::ok in {time.time() - started:.0f}s: {files}")
              except Exception as exc:
                  text = " | ".join(log.lines)[-500:] or str(exc)[-500:]
                  print(f"::error title={label}::{text}".replace("\n", " "))

          attempt("default", format="bestaudio/best")
          for client in ("tv", "tv_simply", "web_safari", "web_embedded", "android_vr", "ios", "mweb"):
              attempt(f"client-{client}", format="bestaudio/best",
                      extractor_args={"youtube": {"player_client": [client]}})
          attempt("captions", skip_download=True, writeautomaticsub=True, subtitleslangs=["en"], subtitlesformat="json3")
          PY
