name: Financial statements
run-name: Financial statements (${{ github.event_name }})

# Refreshes the stock page's Financials tab (quarterly results, P&L, balance
# sheet, cash flow) for both markets.
#
# Separate from the screener workflows on purpose. These tables are display
# evidence: the model derives its own statement factors and never reads the
# financial_statements table, so a failure here must never touch the run that
# publishes scores, and this job needs none of their caches.
#
# Daily, but cheap. The worker refreshes a symbol only when its stored copy is
# older than --max-age-days or its latest quarter implies new results are due,
# so a normal day fetches a few dozen names. The per-run cap bounds the cold
# build instead: at 500 a run, NSE fills in about five days and the US universe
# in about ten, most-investable names first.

on:
  schedule:
    # 03:00 UTC (08:30 IST, 23:00 ET): after the NSE screener has published and
    # after the US screener's last retry slot at 01:30 UTC, so the universe read
    # from each market's latest run is the fresh one.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      max_symbols:
        description: Symbols to fetch per market this run (raise to speed a backfill)
        required: false
        default: "500"
        type: string
      symbols:
        description: Refresh exactly these (space separated, NSE job only), ignoring staleness
        required: false
        type: string
      dry_run:
        description: Fetch and report without writing to Supabase
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  refresh:
    name: ${{ matrix.market }}
    runs-on: ubuntu-latest
    # ~2 s per symbol plus a short pause; 500 symbols is ~20 minutes.
    timeout-minutes: 60
    strategy:
      # The markets write disjoint rows (market is part of the key); one
      # failing must not cancel the other.
      fail-fast: false
      matrix:
        market: [NSE, US]
    concurrency:
      group: financial-statements-${{ matrix.market }}
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MARKET: ${{ matrix.market }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # The CI lock: no torch/transformers, which this worker never imports.
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt

      - name: Refresh financial statements
        env:
          MAX_SYMBOLS: ${{ inputs.max_symbols || '500' }}
          SYMBOLS: ${{ matrix.market == 'NSE' && inputs.symbols || '' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          python -m workers.financial_statements \
            --market "${MARKET}" \
            --max-symbols "${MAX_SYMBOLS}" \
            ${SYMBOLS:+--symbols ${SYMBOLS}} \
            ${DRY_RUN}
