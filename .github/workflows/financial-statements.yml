name: Financial statements
run-name: Financial statements (${{ github.event_name }})

# Refreshes the stock page's Financials tab (quarterly results, P&L, balance
# sheet, cash flow) for both markets.
#
# Separate from the screener workflows on purpose. These tables are display
# evidence: the model derives its own statement factors and never reads the
# financial_statements table, so a failure here must never touch the run that
# publishes scores, and this job needs none of their caches.
#
# Three times a day, and each run is bounded by time rather than by count.
#
# Cold build (a new table or market): every run fetches for up to 50 minutes,
# ~1,300 symbols at ~2.3 s each, then stops cleanly and the next run carries
# on -- never-fetched symbols always come first, most-investable first. NSE's
# ~2,300 names and the US's ~1,500 therefore fill within the first day, with
# no manual run needed.
#
# Steady state: the worker refreshes a symbol only when its stored copy is
# older than --max-age-days or its latest quarter implies new results are due,
# so a run finds a few dozen names, finishes in a minute or two, and most of
# the three daily runs are near-empty.

on:
  schedule:
    # 03:00, 09:00 and 15:00 UTC. The first follows the US screener's last
    # retry slot (01:30 UTC); the last follows the NSE screener (11:00/13:00
    # UTC), so each market's newest universe is picked up the same day. None
    # overlaps a screener run, so they never contend for Yahoo.
    - cron: "0 3,9,15 * * *"
  workflow_dispatch:
    inputs:
      max_symbols:
        description: Upper bound on symbols per market this run (the time budget usually binds first)
        required: false
        default: "5000"
        type: string
      symbols:
        description: Refresh exactly these (space separated, NSE job only), ignoring staleness
        required: false
        type: string
      dry_run:
        description: Fetch and report without writing to Supabase
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  refresh:
    name: ${{ matrix.market }}
    runs-on: ubuntu-latest
    # The worker stops itself at 50 minutes (see --time-budget-minutes below);
    # the remaining margin covers setup and the final write.
    timeout-minutes: 60
    strategy:
      # The markets write disjoint rows (market is part of the key); one
      # failing must not cancel the other.
      fail-fast: false
      matrix:
        market: [NSE, US]
    concurrency:
      group: financial-statements-${{ matrix.market }}
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MARKET: ${{ matrix.market }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # The CI lock: no torch/transformers, which this worker never imports.
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt

      - name: Refresh financial statements
        env:
          MAX_SYMBOLS: ${{ inputs.max_symbols || '5000' }}
          SYMBOLS: ${{ matrix.market == 'NSE' && inputs.symbols || '' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          python -m workers.financial_statements \
            --market "${MARKET}" \
            --max-symbols "${MAX_SYMBOLS}" \
            --time-budget-minutes 50 \
            ${SYMBOLS:+--symbols ${SYMBOLS}} \
            ${DRY_RUN}
