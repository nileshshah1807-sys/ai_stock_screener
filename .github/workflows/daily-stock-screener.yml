name: Daily stock screener

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EMAIL_ENABLED: "True"
      EMAIL_DELIVERY_METHOD: GMAIL_API
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      ATTACH_CSV: "True"
      ATTACH_PDF: "True"
      TRANSCRIPT_SENTIMENT_ENABLED: "True"
      TRANSCRIPT_SHADOW_MODE: "True"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore market-data cache
        id: market-data-cache
        uses: actions/cache/restore@v4
        with:
          path: reports_advanced
          key: stock-screener-data-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            stock-screener-data-v1-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run stock screener
        run: python app.py

      - name: Save refreshed market-data cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: reports_advanced
          key: ${{ steps.market-data-cache.outputs.cache-primary-key }}