name: Daily stock screener
run-name: Daily stock screener (${{ github.event_name }}${{ inputs.mode && format(', {0}', inputs.mode) || '' }})

on:
  schedule:
    # Primary at 16:37 IST; fallback at 18:37 IST, after the 16:15 NSE
    # trade-modification cutoff. Calendar-day and completed-session guards
    # keep fallback/weekend/holiday runs from rebuilding the same snapshot.
    # The 20:37 and 22:37 IST slots exist because GitHub starts these hours
    # late or not at all (5 Oct 2026: the 16:30 IST slot began at 00:54 IST and
    # nothing followed it), and because they fall after NSE has published the
    # bhavcopy the price fallback reads. All four build the same session, so
    # once one succeeds the rest stop at the dedupe step.
    #
    # Minute 7, not 0. GitHub runs schedules best-effort and says the start of
    # an hour is when they are delayed most. On the hour, the primary slot's
    # start slid from about 20:10 IST in early September 2026 to about 22:30
    # by October, with one run a day appearing out of four slots. Moving off
    # the hour is GitHub's own advice; it lowers the odds and guarantees
    # nothing.
    - cron: "7 11,13,15,17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          production scores and publishes exactly as the scheduled run does
          (repository write access is already required to dispatch). validation
          runs the candidate model into .validation-output and publishes nothing.
        type: choice
        options: [production, validation]
        default: production
      send_email:
        description: Reserved for compatibility; manual validation never sends email
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  # Production runs share one group whatever triggered them, so a manual
  # production run and a cron slot never race on the caches or the publish.
  group: daily-stock-screener-${{ inputs.mode == 'validation' && 'validation' || 'production' }}
  cancel-in-progress: false

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      # A manual dispatch in validation mode is an isolated candidate run.
      # Scheduled runs and production dispatches alone may reuse production
      # caches, append backtest history, query the red-flag store or publish;
      # only scheduled runs send the email.
      OUTPUT_DIR: ${{ inputs.mode == 'validation' && format('.validation-output/{0}', github.run_id) || 'reports_advanced' }}
      YFINANCE_CACHE_DIR: ${{ inputs.mode == 'validation' && format('.validation-output/{0}/yfinance_cache', github.run_id) || 'reports_advanced/yfinance_cache' }}
      BACKTEST_WRITES_ENABLED: ${{ (github.event_name == 'schedule' || inputs.mode == 'production') }}
      RUN_MANIFEST_ENABLED: "True"
      # Model 5.x is the production contract, for scheduled runs and production
      # dispatches alike. Validation dispatches remain isolated 4.x smoke runs.
      FACTOR_MODEL_ENABLED: ${{ (github.event_name == 'schedule' || inputs.mode == 'production') && 'True' || 'False' }}
      # 5.1.0: value/quality reweighting and research-first ranking, both
      # justified in docs/Review/p0_implementation_plan.md §8. Semantic ranking
      # change, so the version bumps per the contract in screener/runtime.py.
      # 5.2.0: the latest reported quarter enters the growth block
      # (FACTOR_GROWTH_QUARTER_SHARE); see docs/model_methodology.md.
      MODEL_VERSION: ${{ (github.event_name == 'schedule' || inputs.mode == 'production') && '5.2.0' || '4.0.0-candidate' }}
      RECOMMENDATION_POLICY_VERSION: ${{ (github.event_name == 'schedule' || inputs.mode == 'production') && '5.5.0' || '4.0.0-candidate' }}
      OUTPUT_SCHEMA_VERSION: "4.2.0"
      MODEL_VALIDATION_STATUS: ${{ (github.event_name == 'schedule' || inputs.mode == 'production') && 'Production active; point-in-time validated over four windows incl. 2018-2020 drawdown; weights fitted in-sample, forward validation pending' || 'Research model; point-in-time out-of-sample validation pending' }}
      # A factor cross-section is not representative while statement coverage
      # is partial. The first production run can build the whole NSE cache;
      # subsequent runs normally reuse its 90-day statement records.
      STATEMENT_FETCH_MAX_SYMBOLS_PER_RUN: ${{ (github.event_name == 'schedule' || inputs.mode == 'production') && '2500' || '400' }}
      FACTOR_MIN_STATEMENT_UNIVERSE_COVERAGE: "0.95"
      # Latest-quarter growth is measured from NSE's results filings, with
      # Yahoo's quote metadata for what the filings cannot serve (banks and
      # insurers, a company with no year-ago filing). Yahoo republishes a
      # result days or weeks after it is filed, and through a results season
      # that ranked companies which had reported on the quarter before
      # (screener/quarterly_results.py). The filings are read from the
      # quarterly_filings table, which quarterly-filings.yml fills every 15
      # minutes as companies file; this run fetches nothing from the exchange.
      # Read only where the run has Supabase credentials (scheduled and
      # production runs); a validation dispatch keeps Yahoo's figures.
      QUARTERLY_RESULTS_FILINGS_ENABLED: "True"
      # Only the scheduled run emails; a manual rerun must not send it twice.
      EMAIL_ENABLED: ${{ github.event_name == 'schedule' }}
      EMAIL_DELIVERY_METHOD: GMAIL_API
      EMAIL_SENDER: ${{ github.event_name == 'schedule' && secrets.EMAIL_SENDER || '' }}
      EMAIL_RECEIVER: ${{ github.event_name == 'schedule' && secrets.EMAIL_RECEIVER || '' }}
      GMAIL_CLIENT_ID: ${{ github.event_name == 'schedule' && secrets.GMAIL_CLIENT_ID || '' }}
      GMAIL_CLIENT_SECRET: ${{ github.event_name == 'schedule' && secrets.GMAIL_CLIENT_SECRET || '' }}
      GMAIL_REFRESH_TOKEN: ${{ github.event_name == 'schedule' && secrets.GMAIL_REFRESH_TOKEN || '' }}
      ATTACH_CSV: "True"
      ATTACH_PDF: "True"
      TRANSCRIPT_SENTIMENT_ENABLED: "True"
      TRANSCRIPT_SENTIMENT_WEIGHT: "1.0"
      # A call is not mandatory. Missing transcript evidence must remain neutral.
      REQUIRE_TRANSCRIPT_FOR_STRONG_BUY: "False"
      TRANSCRIPT_MIN_PRIORITY_SCORE: "55"
      TRANSCRIPT_MAX_PRIORITY_RISK: "60"
      TRANSCRIPT_FAIL_ON_ERROR: "True"
      MIN_MEDIAN_TURNOVER_20D_INR: "5000000"
      # Liquidity is an execution overlay; it must not select the research
      # universe used by Investment_Rank.
      PREFILTER_RESEARCH_UNIVERSE_BY_LIQUIDITY: "False"
      # NSE's list plus mainboard companies listed on BSE alone (~1,700), screened
      # as SYMBOL.BO from Yahoo (screener/universe.py nse_with_bse_only).
      NSE_UNIVERSE_SOURCE: "nse_with_bse_only"
      ALLOW_PROVISIONAL_MARKET_BARS: "False"
      MARKET_BAR_COMPLETE_AFTER_IST: "16:15"
      # When Yahoo has not served the session's bar for a symbol, take that one
      # bar from NSE's bhavcopy (screener/session_bars.py). On 5 Oct 2026 Yahoo
      # still lacked the session for two thirds of the universe twenty hours
      # after the close. The bhavcopy is published in the evening, so the
      # 16:30 IST slot may run before it exists; the later slots do not.
      PRICE_BAR_FALLBACK_ENABLED: "True"
      # Yahoo applies no adjustment to an NSE demerger or rights issue, and
      # back-adjusts some splits only part of the way, so the price cut scores
      # as a crash. History before each such change of basis is restated, and
      # single-session bad prints are dropped (screener/price_basis.py).
      PRICE_BASIS_RESTATEMENT_ENABLED: "True"
      # NSE/CMTR/71775 plus partial modification NSE/CMTR/72260,
      # weekday Capital Market holidays known as of 10-Aug-2026.
      # Update annually from the official NSE circular; it is config-hashed.
      NSE_MARKET_HOLIDAYS: "2026-01-15,2026-01-26,2026-03-03,2026-03-26,2026-03-31,2026-04-03,2026-04-14,2026-05-01,2026-05-28,2026-06-26,2026-09-14,2026-10-02,2026-10-20,2026-11-10,2026-11-24,2026-12-25"
      NSE_MARKET_CALENDAR_VERSION: "NSE-CMTR-71775+72260-asof-2026-08-10"
      NSE_LIQUIDITY_ENABLED: "True"
      # Configurable reference order. NSE impact cost directly supports Rs1 lakh;
      # larger values also require the turnover-participation proxy.
      PORTFOLIO_TARGET_POSITION_INR: ${{ vars.PORTFOLIO_TARGET_POSITION_INR || '100000' }}
      LIQUIDITY_POSITION_PARTICIPATION_RATE: ${{ vars.LIQUIDITY_POSITION_PARTICIPATION_RATE || '0.01' }}
      LIQUIDITY_MIN_TRADING_FREQUENCY: "0.80"
      LIQUIDITY_MAX_TURNOVER_TOP5_SHARE: "0.50"
      # Shadow-only evidence: it adds audit columns and never changes live score/rating.
      RED_FLAG_ENRICHMENT_ENABLED: ${{ (github.event_name == 'schedule' || inputs.mode == 'production') && (vars.RED_FLAG_ENRICHMENT_ENABLED || 'True') || 'False' }}
      SUPABASE_URL: ${{ (github.event_name == 'schedule' || inputs.mode == 'production') && secrets.SUPABASE_URL || '' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ (github.event_name == 'schedule' || inputs.mode == 'production') && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
    steps:
      - name: Skip successful scheduled duplicate
        id: schedule-dedupe
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          # Keyed to the session a run could build -- the IST date of the most
          # recent close -- not the UTC calendar date, as in
          # daily-us-screener.yml. GitHub has started these slots over eight
          # hours late; a 17:07 UTC slot that starts after midnight UTC built
          # yesterday's session but, keyed on the calendar date, counted as
          # today's success and skipped all four of today's slots.
          #
          # Only a run that reached the session guard counts: a run skipped
          # here is also a "success". Any lookup failure falls through to the
          # guard, which checks Supabase itself.
          IFS=: read -r cutoff_h cutoff_m _ <<< "${MARKET_BAR_COMPLETE_AFTER_IST}"
          cutoff_seconds=$(( 10#${cutoff_h} * 3600 + 10#${cutoff_m} * 60 ))
          session_day() { TZ=Asia/Kolkata date -d "@$(( $(date -d "$1" +%s) - cutoff_seconds ))" +%F; }
          session="$(session_day now)"
          published=false
          while read -r run_id created; do
            [ "$(session_day "${created}")" = "${session}" ] || continue
            guard="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" --jq '[.jobs[].steps[]? | select(.name == "Check whether completed NSE session is already published") | .conclusion][0] // ""')" || guard=""
            if [ "${guard}" = "success" ]; then
              published=true
              break
            fi
          done < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-stock-screener.yml --event schedule --status success --limit 20 --json databaseId,createdAt --jq '.[] | "\(.databaseId) \(.createdAt)"')
          if [ "${published}" = "true" ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "A scheduled screener run already covered the ${session} session; skipping fallback."
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/checkout@v6
        if: steps.schedule-dedupe.outputs.skip != 'true'

      - uses: actions/setup-python@v6
        if: steps.schedule-dedupe.outputs.skip != 'true'
        with:
          python-version: "3.12"
          # No pip cache: this job needs the production lock, whose torch/CUDA
          # wheels make a ~3 GB cache entry. Three of those filled the
          # repository's 10 GB cache and evicted the price and statement caches
          # that actually save time (29 Sept 2026). Installing afresh costs ~1 min.

      - name: Restore market-data cache
        if: steps.schedule-dedupe.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.mode == 'production')
        id: market-data-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            reports_advanced/price_cache.csv
            reports_advanced/fundamental_cache.csv
            reports_advanced/nse_liquidity_categories.csv
            reports_advanced/backtest_history.csv
            reports_advanced/yfinance_cache
          key: stock-screener-data-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            stock-screener-data-v2-${{ runner.os }}-
            stock-screener-data-v1-${{ runner.os }}-

      # Statements have a separate cache contract. Adding this path to the
      # composite cache changes GitHub's hidden cache version and invalidates
      # every warm production entry created before Model 5.0.
      - name: Restore production statement cache
        if: steps.schedule-dedupe.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.mode == 'production')
        id: production-statement-cache
        uses: actions/cache/restore@v6
        with:
          path: reports_advanced/statement_cache.csv
          key: stock-screener-statements-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stock-screener-statements-v1-${{ runner.os }}-

      - name: Install dependencies
        if: steps.schedule-dedupe.outputs.skip != 'true'
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run regression tests
        if: steps.schedule-dedupe.outputs.skip != 'true'
        env:
          TRANSCRIPT_ENABLE_FINBERT: "false"
        run: python -m unittest discover -s tests

      - name: Check whether completed NSE session is already published
        id: session-guard
        if: steps.schedule-dedupe.outputs.skip != 'true' && github.event_name == 'schedule'
        run: python -m workers.scheduled_session_guard

      - name: Run stock screener
        if: steps.schedule-dedupe.outputs.skip != 'true' && steps.session-guard.outputs.skip != 'true'
        run: python app.py

      - name: Publish report artifact
        if: success() && steps.schedule-dedupe.outputs.skip != 'true' && steps.session-guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: stock-screener-report-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT_DIR }}/advanced_analysis_*.csv
            ${{ env.OUTPUT_DIR }}/advanced_analysis_*.manifest.json
            ${{ env.OUTPUT_DIR }}/dashboard_*.html
            ${{ env.OUTPUT_DIR }}/stock_report_*.pdf
          if-no-files-found: error
          retention-days: 7

      - name: Save refreshed market-data cache
        if: success() && steps.schedule-dedupe.outputs.skip != 'true' && steps.session-guard.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.mode == 'production')
        uses: actions/cache/save@v6
        with:
          path: |
            reports_advanced/price_cache.csv
            reports_advanced/fundamental_cache.csv
            reports_advanced/nse_liquidity_categories.csv
            reports_advanced/backtest_history.csv
            reports_advanced/yfinance_cache
          key: ${{ steps.market-data-cache.outputs.cache-primary-key }}

      - name: Save refreshed production statement cache
        # Checkpoint a valid partial/full statement build even when the screener
        # later fails the coverage guard. This avoids refetching successful
        # records on the next run. hashFiles prevents saving a missing cache.
        if: always() && steps.schedule-dedupe.outputs.skip != 'true' && steps.session-guard.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.mode == 'production') && hashFiles('reports_advanced/statement_cache.csv') != ''
        uses: actions/cache/save@v6
        with:
          path: reports_advanced/statement_cache.csv
          key: ${{ steps.production-statement-cache.outputs.cache-primary-key }}

      - name: Publish dashboard read model
        # Deliberately the last step. The report artifact and the refreshed
        # cache are both saved first, so a Supabase outage costs only the
        # dashboard refresh -- it keeps serving the previous run behind its
        # staleness banner -- and never the day's report or the warm cache that
        # a cold rebuild would take about an hour to recreate.
        #
        # Scheduled runs and production dispatches only: a validation dispatch
        # is an isolated candidate run and must never overwrite what production serves.
        if: success() && steps.schedule-dedupe.outputs.skip != 'true' && steps.session-guard.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.mode == 'production')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          csv="$(ls -1 "${OUTPUT_DIR}"/advanced_analysis_*.csv | sort | tail -n 1)"
          echo "Publishing ${csv} to the dashboard read model"
          python -m workers.dashboard_publisher --csv "${csv}" --if-exists skip
