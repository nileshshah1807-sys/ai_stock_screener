name: Daily stock screener
run-name: Daily stock screener (${{ github.event_name }})

on:
  schedule:
    # Primary at 08:47 IST; fallback at 10:47 IST. The fallback exits quickly
    # when a scheduled run has already succeeded on the same UTC date.
    - cron: "17 3,5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-stock-screener-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      EMAIL_ENABLED: "True"
      EMAIL_DELIVERY_METHOD: GMAIL_API
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      ATTACH_CSV: "True"
      ATTACH_PDF: "True"
      TRANSCRIPT_SENTIMENT_ENABLED: "True"
      TRANSCRIPT_SENTIMENT_WEIGHT: "0.15"
      REQUIRE_TRANSCRIPT_FOR_STRONG_BUY: "True"
      TRANSCRIPT_MIN_TECHNICAL_SCORE: "45"
      TRANSCRIPT_FULL_WEIGHT_TECHNICAL_SCORE: "60"
      TRANSCRIPT_MIN_PRIORITY_SCORE: "55"
      TRANSCRIPT_MAX_PRIORITY_RISK: "60"
      TRANSCRIPT_FAIL_ON_ERROR: "True"
      # Repository variable; absent means report enrichment remains disabled.
      RED_FLAG_ENRICHMENT_ENABLED: ${{ vars.RED_FLAG_ENRICHMENT_ENABLED || 'False' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Skip successful scheduled duplicate
        id: schedule-dedupe
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          today="$(date -u +%F)"
          successful_runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-stock-screener.yml --event schedule --status success --limit 20 --json createdAt --jq '.[].createdAt')"
          if grep -q "^${today}T" <<< "${successful_runs}"; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "A scheduled screener run already succeeded on ${today}; skipping fallback."
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/checkout@v4
        if: steps.schedule-dedupe.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.schedule-dedupe.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore market-data cache
        if: steps.schedule-dedupe.outputs.skip != 'true'
        id: market-data-cache
        uses: actions/cache/restore@v4
        with:
          path: reports_advanced
          key: stock-screener-data-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            stock-screener-data-v1-${{ runner.os }}-

      - name: Install dependencies
        if: steps.schedule-dedupe.outputs.skip != 'true'
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run regression tests
        if: steps.schedule-dedupe.outputs.skip != 'true'
        env:
          TRANSCRIPT_ENABLE_FINBERT: "false"
        run: python -m unittest discover -s tests

      - name: Run stock screener
        if: steps.schedule-dedupe.outputs.skip != 'true'
        run: python app.py

      - name: Save refreshed market-data cache
        if: success() && steps.schedule-dedupe.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: reports_advanced
          key: ${{ steps.market-data-cache.outputs.cache-primary-key }}
